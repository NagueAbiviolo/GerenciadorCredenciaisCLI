# Configuração do cargo-deny para auditoria de dependências (supply chain).

[advisories]
# Vulnerabilidades conhecidas no RustSec Advisory Database são negadas por padrão.
yanked = "warn"
ignore = [
    # chrono sem manutenção: troca por `time`/`jiff` acompanhada no issue #28.
    { id = "RUSTSEC-2026-0543", reason = "substituição planejada no issue #28" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Usada por clipboard-win e error-code (dependências de arboard no Windows)
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "cofre-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

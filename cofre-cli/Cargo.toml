[package]
name = "cofre-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cofre"
path = "src/main.rs"

[dependencies]
cofre-crypto = { path = "../cofre-crypto" }
cofre-db = { path = "../cofre-db" }
cofre-services = { path = "../cofre-services" }
cofre-automacao = { path = "../cofre-automacao" }
cofre-backup = { path = "../cofre-backup" }
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
comfy-table = "7"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
arboard = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
